[project]
name = "lights-out"
version = "0.2.0"
description = "Guardrailed on-prem ops agent: replayed incident drills, enforced read-only policy, energy per correct diagnosis"
readme = "README.md"
authors = [{ name = "Alexander Feht" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
lights-out = "lights_out.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis",
    "mypy",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
