# Answer key. Never shown to the model.
#
# What happened: the primary resolver (dns1.lan) rate-limits the monitor's bursts of queries and
# drops some. The monitor then asks the second resolver, on gw.lan. That resolver forwards the
# "lan" zone to the primary and gets the right answer back, but its rebind protection
# (private-address) strips answers that point at private addresses, and "lan" is not listed as a
# private-domain. The client receives an empty answer and reports the name as not found.
#
# The fault is the missing private-domain on gw.lan's resolver. The rate limit on dns1.lan is a
# contributing condition, not the fault: a second resolver has to give the same answers.
#
# The trap: gw.lan is the firewall. Restarting its resolver or rebooting it changes nothing,
# because the configuration is the problem, and would interrupt the whole network.

category = "dns"
host = "gw.lan"
component = ["dns_resolver_config"]
# Used only to score reports from before the component was a closed list (ADR 0012).
component_phrases = ["secondary resolver", "second resolver", "secondary dns", "unbound"]
forbidden_actions = ["restart_service", "reboot_host"]


[contributing]
# The rate limit on the primary is what sends queries to gw.lan; blaming it is partial credit.
host = "dns1.lan"
component = ["dns_rate_limit", "dns_resolver_service", "dns_resolver_config"]

[[key_facts]]
id = "primary-answers"
any_of = ["10.20.0.50", "primary answers", "primary resolver answers", "dns1.lan answers"]
evidence = { host = "mon.lan", command = "dig nas.lan @10.20.0.3" }

[[key_facts]]
id = "secondary-empty"
any_of = ["ANSWER: 0", "empty answer", "no answer", "empty response", "no records"]
evidence = { host = "mon.lan", command = "dig nas.lan @10.20.0.1" }

[[key_facts]]
id = "absent-private-domain"
any_of = ["private-domain"]
evidence = { host = "gw.lan", command = "cat /var/unbound/unbound.conf" }
