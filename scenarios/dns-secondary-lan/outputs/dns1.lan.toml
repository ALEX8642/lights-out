argv = ["cat", "/etc/hosts"]
stdout = """
127.0.0.1       localhost
10.20.0.3       dns1.lan dns1
"""

[[command]]
argv = ["cat", "/etc/resolv.conf"]
stdout = """
nameserver 127.0.0.1
"""

