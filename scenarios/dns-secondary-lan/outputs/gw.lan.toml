[[command]]
argv = ["cat", "/var/unbound/unbound.conf"]
stdout = """
# Generated by the firewall. Do not edit by hand.
server:
  chroot: /var/unbound
  username: unbound
  directory: /var/unbound
  interface: 10.20.0.1
  interface: 127.0.0.1
  port: 53
  access-control: 10.20.0.0/16 allow
  access-control: 127.0.0.0/8 allow
  hide-identity: yes
  hide-version: yes
  harden-glue: yes
  prefetch: yes
  # DNS rebinding protection: drop answers for public names that point at private addresses
  private-address: 10.0.0.0/8
  private-address: 127.0.0.0/8
  local-zone: "local." static

forward-zone:
  name: "lan."
  forward-addr: 10.20.0.3

forward-zone:
  name: "."
  forward-tls-upstream: yes
  forward-first: yes
  forward-addr: 1.1.1.2@853
  forward-addr: 9.9.9.9@853
"""

