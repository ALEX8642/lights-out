[[command]]
argv = ["pfctl", "-s", "rules"]
stdout = """
scrub on vtnet0 all fragment reassemble
block drop in log on vtnet0 all label "default deny on wan"
pass in quick on vtnet1 inet proto udp from 10.20.0.0/16 to 10.20.0.1 port = domain keep state label "lan dns"
pass in quick on vtnet1 inet proto tcp from 10.20.0.0/16 to 10.20.0.1 port = domain flags S/SA keep state label "lan dns"
pass in quick on vtnet1 inet from 10.20.0.0/16 to any flags S/SA keep state label "lan to any"
pass out quick all flags S/SA keep state label "let out anything from firewall host itself"
"""

